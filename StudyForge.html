<style>
/* ============ StudyForge — design "Nebbia": arioso, morbido, a riquadri ============ */
:root{--acc:#6c5ce7;--on:#fff;--at:#6c5ce7;--r:20px;--pad:20px;--g2:color-mix(in srgb,var(--acc) 55%,#a855f7);--fb:'Plus Jakarta Sans',system-ui,sans-serif;--fm:'DM Mono',ui-monospace,monospace;--fd:var(--fb)}

[data-dense="1"]{--pad:13px}

[data-theme=sorbetto] .card,[data-theme=sorbetto] aside,[data-theme=sorbetto] .bn{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}

button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}

a{color:var(--at)}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.grid2>.card{margin:0}

.b.sm{padding:6px 12px;font-size:.82rem}.b.w{width:100%;margin-top:10px}
.ib{width:34px;height:34px;border-radius:calc(var(--r)*.55);border:0;background:var(--card2);display:inline-grid;place-items:center;flex:none;font-size:.95rem;color:var(--mut)}
.ib:hover{color:var(--ink)}.ib.sm{width:28px;height:28px;font-size:.8rem}
input,select,textarea{width:100%;background:var(--card2);border:var(--bw) solid transparent;border-radius:calc(var(--r)*.6);padding:10px 13px;outline:none;transition:.15s}
[data-theme=grafite] input,[data-theme=grafite] select,[data-theme=grafite] textarea{border-color:var(--bd)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
textarea{resize:vertical;min-height:64px}
input[type=color]{padding:3px;height:42px;min-width:46px}input[type=range]{padding:0;accent-color:var(--acc);box-shadow:none;background:none}
input[type=checkbox]{width:auto}
label{display:block;font-size:.75rem;font-weight:700;color:var(--mut);margin-top:13px;letter-spacing:.02em}
label>input,label>select,label>textarea{margin-top:6px;font-weight:500;color:var(--ink);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}

[data-theme=grafite] .ch{border-color:var(--bd)}
.ch:hover{filter:brightness(.96)}.ch.on{background:var(--acc);color:var(--on);box-shadow:0 6px 14px -8px var(--acc)}
.pill{font:600 .68rem var(--fb);padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap}
.pill.on{background:var(--acc);color:var(--on)}
.sw{display:flex;align-items:center;gap:12px;font-size:.92rem;color:var(--ink);font-weight:500;cursor:pointer;margin-top:12px}
.sw input{display:none}.sw span{width:42px;height:25px;border-radius:99px;background:color-mix(in srgb,var(--mut) 35%,transparent);position:relative;flex:none;transition:.2s}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span:after{left:20px}
.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.pb{height:7px;border-radius:9px;overflow:hidden;background:var(--card2);margin-top:10px}.pb i{display:block;height:100%;border-radius:9px;background:var(--c,var(--acc));transition:width .5s}
.hero{padding:26px}.hero .num{position:relative;z-index:1;font:800 clamp(4.6rem,18vw,7.6rem)/.9 var(--fd);letter-spacing:-.06em}.hero>*{position:relative;z-index:1}
.hero .pb{background:rgba(255,255,255,.25)}.hero .pb i{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}.stats b{display:block;font:800 1.45rem var(--fd);letter-spacing:-.03em}.stats span{font-size:.72rem;color:var(--mut)}
.ringbox{position:relative;width:132px;margin:0 auto}.ringbox svg{display:block;width:100%}.ringbox .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:800 1.5rem var(--fd)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:30px 4px 0}
.qa{margin-top:12px}

.tk:hover{transform:translateY(-1px)}.tk[draggable=true]{cursor:grab}

.dy .dots{display:flex;gap:3px;flex-wrap:wrap}.dy .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dy .fl{position:absolute;right:6px;top:4px;font-size:.7rem;color:var(--at)}.dy.on .fl{color:#fff}
.dy.full{background:color-mix(in srgb,var(--ok) 22%,var(--card2))}.dy.on.full{background:var(--acc)}
.scard{overflow:hidden}.sch{display:flex;gap:13px;align-items:center;cursor:pointer}.sch>div{flex:1;min-width:0}

.tc{cursor:pointer;transition:transform .15s}.tc:hover{transform:translateY(-3px)}.tc.act{box-shadow:inset 0 0 0 2px var(--acc),var(--sh)}.tcc{font:800 1.9rem var(--fd);letter-spacing:-.04em;background:linear-gradient(135deg,var(--acc),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}.tcf{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* ===== Stato & StorageManager (versionato, migrazione sicura, copie automatiche) ===== */
const KEY='studyforge_app_data_v1';
const DEF={v:3,appv:'',demo:false,bi:0,exam:{name:'',start:'',date:'',target:0,tolc:''},
 cfg:{ui:0,theme:'auto',accent:'#6c5ce7',font:'moderno',radius:20,dense:false,motion:true,weekStart:1,xp:true,rev:'3,7,21',hours:2,days:[1,2,3,4,5],goal:120,notif:false,wel:true,score:{c:1,w:.25},widgets:{count:true,streak:true,over:true,rev:true,events:true,badges:true}},
 subs:[],topics:{},tasks:[],sims:[],events:[],log:[],act:{},rest:{},bd:{},xp:0,lb:'',lbs:'',tmods:{},tcustom:[],tm:{},pom:{work:25,brk:5,long:15,every:4,auto:false}};
function migrate(o){
 if(!o||typeof o!=='object')return o;
 if((o.v||1)<2){
  const subs=o.subs||[];o.cfg=o.cfg||{};
  if(Array.isArray(o.days)){o.cfg.days=o.days;delete o.days}
  if(typeof o.hours==='number'){o.cfg.hours=o.hours;delete o.hours}
  if(Array.isArray(o.sessions)){
   o.tasks=(o.tasks||[]).concat(o.sessions.map(s=>{const b=subs.find(x=>x.id===s.sub);return{id:'o'+(s.id||uid()),title:b?b.name+' · '+s.type:(s.type||'Sessione'),date:s.date||'',time:'',dur:Math.round((s.h||1)*60),sub:s.sub||'',topics:s.topics||[],type:s.type||'',prio:1,note:'',check:[],done:!!s.done,auto:true,mast:true,spent:0,series:''}}));
   delete o.sessions}
  if(Array.isArray(o.sims))o.sims=o.sims.map(x=>x.secs?x:({id:x.id||uid(),d:x.d,tot:x.tot,tolc:'',note:x.note||'',secs:Object.entries(x.sec||{}).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>({n:(subs.find(s=>s.id===k)||{}).name||k,v:+v}))}));
  o.v=2}
 if((o.v||2)<3)o.v=3; /* v3: solo nuovi campi con valori predefiniti, nessuna trasformazione dei dati */
 return o}
const StorageManager={
 merge(d,s){if(Array.isArray(d))return Array.isArray(s)?s:d;
  if(d&&typeof d==='object'){const o={},ok=s&&typeof s==='object'&&!Array.isArray(s);for(const k in d)o[k]=this.merge(d[k],ok?s[k]:undefined);if(ok)for(const k in s)if(!(k in d))o[k]=s[k];return o}
  return s===undefined||s===null?d:s},
 parse(raw){const st=this.merge(structuredClone(DEF),migrate(JSON.parse(raw)));if(st.cfg.ui!==3)Object.assign(st.cfg,{ui:3,theme:'auto',font:'moderno',accent:'#6c5ce7',radius:20});
  st.tasks=st.tasks.filter(t=>t&&t.id).map(t=>({id:'',title:'',date:'',time:'',dur:60,sub:'',topics:[],type:'',prio:1,note:'',check:[],done:false,auto:false,mast:false,spent:0,series:'',...t}));
  Object.values(st.topics).forEach(t=>{t.rev=Array.isArray(t.rev)?t.rev:[];t.note=t.note||'';t.st=+t.st||0});return st},
 load(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{const st=this.parse(raw);try{if((JSON.parse(raw).v||1)<2&&!localStorage.getItem(KEY+'_pre_v2'))localStorage.setItem(KEY+'_pre_v2',raw);localStorage.setItem(KEY+'_bak',raw)}catch(e){}return st}
   catch(e){console.warn('Dati illeggibili: copia in _corrupt',e);try{localStorage.setItem(KEY+'_corrupt',raw)}catch(_){}}}
  return structuredClone(DEF)},
 save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Spazio pieno o salvataggio bloccato: scarica un backup')}}
};
let NOSTORE=false;try{localStorage.setItem('__sf','1');localStorage.removeItem('__sf')}catch(e){NOSTORE=true}
let S=StorageManager.load(),_chk=0;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function save(){if(!_chk){_chk=1;try{checkBadges()}catch(e){}_chk=0}StorageManager.save()}
const saveSoft=deb(()=>save(),500);
const Snap={list(){try{return JSON.parse(localStorage.getItem(KEY+'_snaps')||'[]')}catch(e){return[]}},
 take(l){const a=this.list();a.unshift({t:Date.now(),l,d:JSON.stringify(S)});const lim=Math.max(2,Math.min(6,Math.floor(1.6e6/(a[0].d.length||1))));while(a.length>lim)a.pop();try{localStorage.setItem(KEY+'_snaps',JSON.stringify(a))}catch(e){try{localStorage.setItem(KEY+'_snaps',JSON.stringify(a.slice(0,1)))}catch(_){}}},
 restore(i){const x=this.list()[i];if(!x)return;this.take('Prima del ripristino');S=StorageManager.parse(x.d);save();applyTheme();closeM();render();toast('Ripristinato')}};

/* ===== Helpers dominio ===== */
const sub=id=>S.subs.find(x=>x.id===id);
const topicsOf=sid=>Object.values(S.topics).filter(t=>t.sub===sid);
const colOf=t=>sub(t.sub)?.color||'var(--acc)';
const mins=()=>S.log.reduce((a,l)=>a+l.min,0);

const lvl=()=>Math.floor(Math.sqrt(S.xp/40))+1;
function gain(n){if(S.cfg.xp){const b=lvl();S.xp+=n;if(lvl()>b){toast('Livello '+lvl()+'! 🎉');confetti()}}S.act[today()]=1}
/* serie: i giorni senza studio contano solo se sono giorni di studio previsti; i giorni di riposo dichiarati non interrompono la serie */
function streak(){const ks=Object.keys(S.act).sort();if(!ks.length)return 0;let d=today(),n=0,i=0;while(d>=ks[0]&&i<1500){if(S.act[d])n++;else if(!(i===0||S.rest[d]||!S.cfg.days.includes(D(d).getDay())))break;d=add(d,-1);i++}return n}
const SyllabusParser={parse(txt){const seen=new Set(),out=[];String(txt||'').split(/[\n;•▪●·]+/).forEach(x=>{x=x.replace(/^\s*(?:[-–—*]|\d+[.)])\s*/,'').trim();(x.length>120&&x.includes(',')?x.split(','):[x]).forEach(y=>{y=y.trim();if(y.length>1&&!seen.has(y.toLowerCase())){seen.add(y.toLowerCase());out.push(y)}})});return out}};
function addTopics(sid,txt){const have=new Set(topicsOf(sid).map(t=>t.t.toLowerCase()));let n=0;SyllabusParser.parse(txt).forEach(x=>{if(have.has(x.toLowerCase()))return;const id='t'+uid();S.topics[id]={id,sub:sid,t:x,st:0,note:'',rev:[],ma:''};have.add(x.toLowerCase());n++});save();return n}
/* SpacedRepetition: +3/+7/+21 giorni (personalizzabili) dopo aver padroneggiato un argomento */
const SR={ints(){const a=String(S.cfg.rev).split(/[,\s;]+/).map(Number).filter(n=>n>0);return a.length?a:[3,7,21]},
 set(id,st){const t=S.topics[id];if(!t)return;const was=t.st;t.st=st;if(st===2&&was!==2){t.ma=today();t.rev=this.ints().map(n=>({d:add(today(),n),done:false}));gain(10)}else if(st!==2){t.rev=t.rev.filter(r=>r.done);t.ma=''}save()},

function genPlan(o){
 const act=S.subs.filter(s=>topicsOf(s.id).length);if(!act.length)return{err:'Servono materie con argomenti'};
 const days=[];for(let d=o.from;d<o.to;d=add(d,1))if(o.ds.has(D(d).getDay()))days.push(d);if(!days.length)return{err:'Nessun giorno disponibile in questo intervallo'};
 let main=o.fin?days.filter(d=>d<=add(o.to,-o.fin)):days;if(!main.length)main=days.slice(0,Math.max(1,Math.ceil(days.length*.8)));
 const fd=days.filter(d=>!main.includes(d)),slots=[];main.forEach(d=>{for(let k=0;k<o.per;k++)slots.push(d)});
 const wt=act.map(s=>Math.max(.1,s.w*(1+.15*(s.diff-3)))),sum=wt.reduce((a,b)=>a+b,0),q=wt.map(w=>w/sum*slots.length),base=q.map(Math.floor);let left=slots.length-base.reduce((a,b)=>a+b,0);
 q.map((v,i)=>[v-base[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>base[i]++);
 const tot=base.slice(),used=act.map(()=>0),out=[],prev={},pick=(arr,i,n)=>{const a=Math.floor(i*arr.length/n),b=Math.floor((i+1)*arr.length/n);return b>a?arr.slice(a,b):[arr[Math.min(arr.length-1,a)]]};
 slots.forEach(d=>{let bi=-1,br=-1;act.forEach((s,i)=>{if(base[i]<=used[i])return;let r=(base[i]-used[i])/tot[i];if(prev[d]===i)r-=.5;if(r>br){br=r;bi=i}});if(bi<0)return;prev[d]=bi;
  const s=act[bi],al=topicsOf(s.id),i=used[bi]++,th=Math.max(1,Math.round(tot[bi]*.65)),pend=al.filter(x=>x.st<2);let type,list;
  if(i<th&&pend.length){type='Teoria';list=pick(pend,i,th)}else{type='Esercizi';list=pick(al,Math.max(0,i-th),Math.max(1,tot[bi]-th))}
  out.push(mkTask({title:`${s.name} · ${type}`,date:d,sub:s.id,topics:list.map(x=>x.id),dur:o.mins,type,auto:true,mast:type==='Teoria'}))});
 fd.forEach((d,i)=>{const sim=i%2===0,gaps=Object.values(S.topics).filter(t=>t.st<2).sort((a,b)=>a.st-b.st).slice(0,6);out.push(mkTask({title:sim?'Simulazione completa':'Ripasso lacune',date:d,dur:o.mins,type:sim?'Simulazione':'Ripasso',topics:sim?[]:gaps.map(x=>x.id),auto:true}))});
 return{out,main:main.length,fd:fd.length,days:days.length}}

let RUN=null,wl=null;
function runStart(id,train){const t=tolcById(id);RUN={id,secs:secsOf(t),i:0,t0:Date.now(),used:[],p:0,train:!!train};$('#run').hidden=false;document.body.classList.add('lock');try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}paintRun(true)}
function paintRun(full){if(!RUN)return;const s=RUN.secs[RUN.i],last=RUN.i===RUN.secs.length-1,now=RUN.p||Date.now(),el=Math.floor((now-RUN.t0)/1000),rem=s.m*60-el;
 if(full)$('#run').innerHTML=`<div class="eyebrow">${esc(tolcById(RUN.id).code)} · ${RUN.train?'allenamento':'simulazione'} · sezione ${RUN.i+1}/${RUN.secs.length}</div><h1>${esc(s.n)}</h1><div class="dim">${s.q} quesiti · ${s.m} minuti · circa ${Math.round(s.m*60/Math.max(1,s.q))} secondi a quesito</div><div class="big" id="rt"></div><div class="pb" style="width:min(420px,80vw)"><i id="rb" style="width:0"></i></div><div class="acts" style="justify-content:center"><button class="b" onclick="runPause()">${RUN.p?'▶ Riprendi':'⏸ Pausa'}</button>${RUN.train&&RUN.i>0?'<button class="b" onclick="runPrev()">← Precedente</button>':''}<button class="b p" onclick="runNext()">${last?'Termina e registra':'Sezione successiva →'}</button><button class="b d" onclick="if(confirm(\'Annullare la simulazione?\'))runStop()">Annulla</button></div><p class="dim" style="max-width:440px">${RUN.train?'Modalità allenamento: nessun cambio automatico di sezione, puoi tornare indietro.':'Come nel vero test: allo scadere del tempo si passa alla sezione dopo.'}</p>`;
 const a=Math.abs(rem);$('#rt').textContent=(rem<0?'+':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');$('#rb').style.width=Math.min(100,el/(s.m*60||1)*100)+'%';
 if(!RUN.p&&!RUN.train&&rem<=0&&s.m>0){beep();navigator.vibrate&&navigator.vibrate([300,100,300]);runNext(true)}}
function runPause(){if(!RUN)return;if(RUN.p){RUN.t0+=Date.now()-RUN.p;RUN.p=0}else RUN.p=Date.now();paintRun(true)}
function runPrev(){if(!RUN||RUN.i<1)return;RUN.i--;RUN.t0=Date.now();RUN.p=0;paintRun(true)}
function runNext(auto){RUN.used[RUN.i]=Math.round(((RUN.p||Date.now())-RUN.t0)/60000);if(RUN.i>=RUN.secs.length-1){const id=RUN.id,u=RUN.used;runStop(1);simForm(id,{used:u});return}RUN.i++;RUN.t0=Date.now();RUN.p=0;if(auto)toast('Tempo scaduto: sezione successiva');paintRun(true)}
function runStop(){RUN=null;$('#run').hidden=true;document.body.classList.remove('lock');try{wl&&wl.release()}catch(e){}}

/* ===== PomodoroTimer / cronometro ===== */
const T=Object.assign({mode:'work',run:false,end:0,left:S.pom.work*60,acc:0,t0:0,cyc:0,sub:'',topic:'',task:''},S.tm||{});
const saveT=()=>{S.tm={...T};save()};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.8);o.start();o.stop(a.currentTime+.8)}catch(e){}}
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function notify(m){try{if(S.cfg.notif&&'Notification' in window&&Notification.permission==='granted')new Notification('StudyForge',{body:m})}catch(e){}}
const Pom={
 tot(){return(T.mode==='work'?S.pom.work:T.mode==='brk'?S.pom.brk:S.pom.long)*60},
 rem(){return T.run?Math.max(0,Math.ceil((T.end-Date.now())/1000)):T.left},
 el(){return T.run?Math.floor((Date.now()-T.t0)/1000):T.acc},
 go(){const n=Date.now();if(T.mode==='free'){if(T.run){T.acc=this.el();T.run=false}else{T.t0=n-T.acc*1000;T.run=true}}else{if(T.run){T.left=this.rem();T.run=false}else{T.end=n+T.left*1000;T.run=true}}saveT();render()},
 log(min){if(min<1)return;S.log.push({d:today(),min,sub:T.sub,topic:T.topic,task:T.task});const k=S.tasks.find(x=>x.id===T.task);if(k)k.spent=(k.spent||0)+min;gain(Math.round(min));save()},
 finish(){T.run=false;beep();navigator.vibrate&&navigator.vibrate([200,100,200]);
  if(T.mode==='work'){this.log(S.pom.work);T.cyc++;toast('Sessione completata 🎉');notify('Sessione completata: fai una pausa');T.mode=T.cyc%S.pom.every===0?'long':'brk'}else{T.mode='work';toast('Pausa finita');notify('Pausa finita: si riparte')}
  T.left=this.tot();if(S.pom.auto){T.end=Date.now()+T.left*1000;T.run=true}saveT();render()},
 stop(){let m=0;if(T.mode==='free')m=Math.floor(this.el()/60);else if(T.mode==='work')m=Math.floor((this.tot()-this.rem())/60);if(m>=1){this.log(m);toast('Registrati '+m+' min')}this.reset()},
 reset(){T.run=false;T.acc=0;T.left=this.tot();saveT();render()},
 mode(m){T.mode=m;T.run=false;T.acc=0;T.left=this.tot();saveT();render()},
 link(id){closeM();const k=S.tasks.find(x=>x.id===id);T.task=id;if(k&&k.sub)T.sub=k.sub;if(k&&k.topics[0])T.topic=k.topics[0];saveT();go('focus')},
 paint(){const m=$('#tm');if(!m){document.title=T.run&&T.mode!=='free'?fmtT(this.rem())+' · StudyForge':'StudyForge';return}
  const s=T.mode==='free'?this.el():this.rem();m.textContent=fmtT(s);const r=$('#rg');if(r){const p=T.mode==='free'?(s%3600)/3600:1-this.rem()/this.tot();r.style.strokeDashoffset=263.9*(1-Math.min(1,Math.max(0,p)))}
  document.title=T.run?fmtT(s)+' · StudyForge':'StudyForge'}};
function setP(k,v){S.pom[k]=Math.max(1,+v||1);if(!T.run&&T.mode!=='free')T.left=Pom.tot();save();render()}
function presetP(w,b,l){S.pom.work=w;S.pom.brk=b;S.pom.long=l;T.mode='work';T.run=false;T.left=w*60;save();render()}
function manLog(){const m=+$('#ml_m').value;if(!m||m<1)return toast('Inserisci i minuti');S.log.push({d:$('#ml_d').value||today(),min:m,sub:$('#ml_s').value,topic:'',task:''});S.log.sort((a,b)=>a.d.localeCompare(b.d));gain(Math.round(m));save();render();toast('Registrato')}
function delLog(i){S.log.splice(i,1);save();render()}
function tgDay(d){S.cfg.days=S.cfg.days.includes(d)?S.cfg.days.filter(x=>x!==d):[...S.cfg.days,d];save();render()}
setInterval(()=>{if(RUN)paintRun();if(T.run){if(T.mode!=='free'&&Pom.rem()<=0)Pom.finish();else Pom.paint()}},300);

/* ===== Notifiche (solo con l'app aperta) ===== */
function notifyOn(on){if(on&&'Notification' in window){Notification.requestPermission().then(p=>{S.cfg.notif=p==='granted';save();render();if(p!=='granted')toast('Permesso negato dal browser')})}else{S.cfg.notif=false;save();render()}}
const NT=new Set();setInterval(()=>{if(!S.cfg.notif||!('Notification' in window)||Notification.permission!=='granted')return;const n=new Date(),d=today(),hm=n.getHours()*60+n.getMinutes();S.tasks.forEach(t=>{if(t.date!==d||t.done||!t.time||NT.has(t.id))return;const[h,m]=t.time.split(':').map(Number),df=h*60+m-hm;if(df<=5&&df>=-1){NT.add(t.id);notify(t.title+' · '+t.time)}})},20000);

/* ===== Demo TOLC-I ===== */
function loadDemo(){if((S.subs.length||S.tasks.length)&&!confirm('La demo sostituisce i dati attuali (una copia automatica resta ripristinabile da Impostazioni). Continuare?'))return;Snap.take('Prima della demo');
 const cf=S.cfg;S=structuredClone(DEF);S.cfg={...DEF.cfg,...cf,wel:false,days:[1,2,3,4,5,6],hours:2};S.demo=true;
 const t=today(),r=importTolc('I');S.exam={name:'TOLC-I',tolc:'I',start:t,date:add(t,84),target:30};
 S.subs.forEach((s,si)=>topicsOf(s.id).forEach((x,i)=>{if(i<(si===0?7:3)){x.st=2;x.ma=add(t,-(i+1)*2);x.rev=SR.ints().map(n=>({d:add(x.ma,n),done:add(x.ma,n)<t}))}else if(i<(si===0?10:4))x.st=1}));
 for(let k=1;k<=14;k++)if(k%5!==0){const d=add(t,-k);S.log.push({d,min:35+((k*17)%70),sub:S.subs[k%S.subs.length].id,topic:'',task:''});S.act[d]=1}
 S.log.sort((a,b)=>a.d.localeCompare(b.d));
 const mk=(d,v)=>{const rows=r.t.secs.concat([{n:'Inglese',q:30,en:1}]).map((s,i)=>({n:s.n,q:s.q,c:v[i][0],w:v[i][1],en:s.en}));const c=calcSim(rows,1,.25);return{id:'m'+uid(),d,tot:c.tot,tolc:'I',secs:c.rows.map(x=>({n:x.n,q:x.q,c:x.c,w:x.w,v:x.v,en:x.en?1:0})),note:'',sc:{c:1,w:.25}}};
 S.sims=[mk(add(t,-21),[[11,6],[6,3],[5,4],[7,2],[18,0]]),mk(add(t,-8),[[14,4],[7,2],[6,3],[8,2],[22,0]])];
 S.events=[{id:'e'+uid(),name:'TOLC-I (demo)',date:S.exam.date,tolc:'I'}];
 const g=genPlan({from:t,to:S.exam.date,ds:new Set(S.cfg.days),mins:60,per:2,fin:12});S.tasks=g.out;S.xp=260;S.bi=1;S.appv=APP_VER;checkBadges(true);save();applyTheme();V.tab='oggi';render();scrollTo(0,0);toast('Demo caricata: esplora tutto, poi eliminala da Impostazioni')}
function clearDemo(){if(!confirm('Eliminare i dati demo? Le tue impostazioni di aspetto restano.'))return;Snap.take('Prima di eliminare la demo');const cf=S.cfg;S=structuredClone(DEF);S.cfg={...cf,wel:false};S.appv=APP_VER;S.bi=1;save();render();toast('Dati demo eliminati')}

/* ===== Dati & Backup ===== */
const Data={
 dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3e3)},
 stamp(){return Y(new Date())+'_'+new Date().toTimeString().slice(0,5).replace(':','-')},
 json(){this.dl(`studyforge_backup_${this.stamp()}.json`,JSON.stringify(S,null,1),'application/json');S.lb=today();save();toast('Backup scaricato')},
 csv(){const r=[['Data','Ora','Titolo','Materia','Tipo','Minuti','Argomenti','Completata']];S.tasks.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(s=>r.push([s.date,s.time,s.title,sub(s.sub)?.name||'',s.type,s.dur,s.topics.map(i=>S.topics[i]?.t).filter(Boolean).join(' | '),s.done?'Sì':'No']));
  this.dl(`studyforge_piano_${this.stamp()}.csv`,'\uFEFF'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv')},
 ics(){const z=n=>String(n).padStart(2,'0'),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//StudyForge//IT'];
  S.tasks.filter(t=>t.date).forEach(t=>{L.push('BEGIN:VEVENT','UID:'+t.id+'@studyforge','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z');
   if(t.time){const s=D(t.date),[h,m]=t.time.split(':').map(Number);s.setHours(h,m);const e=new Date(s.getTime()+(t.dur||60)*6e4),f=d=>`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`;L.push('DTSTART:'+f(s),'DTEND:'+f(e))}
   else L.push('DTSTART;VALUE=DATE:'+t.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+add(t.date,1).replace(/-/g,''));
   L.push('SUMMARY:'+(t.done?'✓ ':'')+t.title.replace(/[,;\n]/g,' '),'END:VEVENT')});
  L.push('END:VCALENDAR');this.dl(`studyforge_${this.stamp()}.ics`,L.join('\r\n'),'text/calendar')},
 copy(){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Dati copiati: incollali sull\'altro dispositivo'),()=>prompt('Copia i dati:',t))},
 paste(){openM(`<h3>Incolla i dati</h3><p class="dim">Incolla il testo copiato con “Copia dati come testo” (o il contenuto di un backup .json).</p><textarea id="pt" rows="6" placeholder="{ … }"></textarea><div class="acts"><button class="b p" onclick="Data.preview($('#pt').value)">Continua</button><button class="b" onclick="closeM()">Annulla</button></div>`)},
 valid(o){return o&&typeof o==='object'&&Array.isArray(o.subs)&&(Array.isArray(o.tasks)||Array.isArray(o.sessions))&&o.topics&&typeof o.topics==='object'},
 read(f){if(f)f.text().then(t=>this.preview(t))},
 preview(t){let o;try{o=JSON.parse(t)}catch(e){return toast('File non valido: JSON illeggibile')}if(!this.valid(o))return toast('Non sembra un backup di StudyForge');
  window._imp=t;const n=Array.isArray(o.tasks)?o.tasks.length:o.sessions.length;
  openM(`<h3>Importa backup</h3><p>${esc((o.exam&&o.exam.name)||'Senza nome')} · ${o.subs.length} materie · ${Object.keys(o.topics).length} argomenti · ${n} attività · ${(o.sims||[]).length} simulazioni.</p><p class="dim"><b>Sostituisci</b> cancella i dati attuali; <b>Unisci</b> mantiene i tuoi e aggiunge ciò che manca. In entrambi i casi prima viene salvata una copia automatica.</p><div class="acts"><button class="b p" onclick="Data.apply('replace')">Sostituisci</button><button class="b" onclick="Data.apply('merge')">Unisci</button><button class="b" onclick="closeM()">Annulla</button></div>`)},
 apply(mode){Snap.take('Prima dell\'importazione');const x=StorageManager.parse(window._imp);if(mode==='merge')this.merge(x);else S=x;save();applyTheme();closeM();render();toast(mode==='merge'?'Dati uniti':'Backup ripristinato')},
 merge(x){const by=(a,b)=>{const s=new Set(a.map(i=>i.id));b.forEach(i=>{if(!s.has(i.id))a.push(i)})};by(S.subs,x.subs);by(S.tasks,x.tasks);by(S.sims,x.sims);by(S.events,x.events);by(S.tcustom,x.tcustom);
  Object.keys(x.topics).forEach(k=>{if(!S.topics[k])S.topics[k]=x.topics[k]});const key=l=>[l.d,l.min,l.sub,l.task].join('|'),have=new Set(S.log.map(key));x.log.forEach(l=>{if(!have.has(key(l)))S.log.push(l)});
  S.log.sort((a,b)=>a.d.localeCompare(b.d));S.sims.sort((a,b)=>a.d.localeCompare(b.d));Object.keys(x.act).forEach(k=>S.act[k]=1);Object.keys(x.rest||{}).forEach(k=>S.rest[k]=1);Object.keys(x.bd||{}).forEach(k=>{if(!S.bd[k])S.bd[k]=x.bd[k]});S.xp=Math.max(S.xp,x.xp);if(!S.exam.date&&x.exam.date)S.exam=x.exam},
 reset(){if(!confirm('Cancellare TUTTI i dati? Verrà salvata una copia automatica ripristinabile.'))return;Snap.take('Prima del reset');const sn=Snap.list();S=structuredClone(DEF);S.appv=APP_VER;S.bi=1;save();try{localStorage.setItem(KEY+'_snaps',JSON.stringify(sn))}catch(e){}applyTheme();render();toast('Dati cancellati')}
};

/* ===== Cerca ovunque (Ctrl/⌘ K) ===== */
let SRES=[];
function searchAll(q){q=q.trim().toLowerCase();const o=[],has=s=>String(s||'').toLowerCase().includes(q);
 if(!q)return[{t:'＋ Nuova attività',s:'azione',f:()=>taskForm('')},...NAV.map(([k,n])=>({t:'Vai a '+n,s:'pagina',f:()=>go(k)})),{t:'Backup .json',s:'azione',f:()=>Data.json()}];
 S.tasks.filter(x=>has(x.title)||has(x.note)).slice(0,8).forEach(x=>o.push({t:x.title,s:'attività'+(x.date?' · '+fmt(x.date,{day:'numeric',month:'short'}):''),f:()=>taskForm(x.id)}));
 Object.values(S.topics).filter(x=>has(x.t)||has(x.note)).slice(0,8).forEach(x=>o.push({t:x.t,s:'argomento · '+(sub(x.sub)?.name||''),f:()=>topicForm(x.id)}));
 S.subs.filter(x=>has(x.name)).slice(0,5).forEach(x=>o.push({t:x.name,s:'materia',f:()=>{V.open[x.id]=true;go('mat')}}));
 S.events.filter(x=>has(x.name)).slice(0,4).forEach(x=>o.push({t:x.name,s:'data',f:()=>eventForm(x.id)}));
 allTolc().filter(x=>has(x.code)||has(x.name)).slice(0,5).forEach(x=>o.push({t:x.code+' '+x.name,s:'TOLC',f:()=>openTolc(x.id)}));
 NAV.filter(([k,n])=>has(n)).forEach(([k,n])=>o.push({t:'Vai a '+n,s:'pagina',f:()=>go(k)}));return o}
function openSearch(){openM(`<input id="sq" placeholder="Cerca attività, argomenti, note, materie, TOLC…" oninput="doSearch(this.value)" autocomplete="off" aria-label="Cerca"><div id="sr" class="mlist"></div>`);doSearch('');setTimeout(()=>$('#sq')&&$('#sq').focus(),50)}
function doSearch(q){SRES=searchAll(q);$('#sr').innerHTML=SRES.length?SRES.map((r,i)=>`<div class="res" onclick="runRes(${i})" tabindex="0" onkeydown="if(event.key==='Enter')runRes(${i})"><span>${esc(r.t)}</span><small>${esc(r.s)}</small></div>`).join(''):'<p class="dim">Nessun risultato.</p>'}
function runRes(i){const r=SRES[i];closeM();r&&r.f()}
document.addEventListener('keydown',e=>{const tg=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName);
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}
 if(typing||e.ctrlKey||e.metaKey||e.altKey||!$('#mo').hidden||!$('#run').hidden)return;
 if(e.key==='/'){e.preventDefault();openSearch()}else if(e.key==='n'||e.key==='N'){e.preventDefault();taskForm('')}else if(e.key==='t'||e.key==='T'){go('oggi')}});

/* ===== Avvio ===== */
(function boot(){
 if(!S.bi){checkBadges(true);S.bi=1}
 const has=S.subs.length||S.tasks.length,a=Snap.list();
 if(S.appv!==APP_VER){if(has)Snap.take(S.appv?'Prima dell\'aggiornamento '+APP_VER:'Prima del primo avvio v'+APP_VER);S.appv=APP_VER}
 else if(has&&(!a.length||Date.now()-a[0].t>12*36e5))Snap.take('Automatico');
 if(T.run&&T.mode!=='free'&&T.end<=Date.now())Pom.finish();else if(!T.run&&T.mode!=='free')T.left=T.left||Pom.tot();
 save();applyTheme();
 const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',()=>S.cfg.theme==='auto'&&applyTheme());
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
 window.addEventListener('error',e=>console.error(e.error||e.message));
 const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))V.tab=h;
 render()})();
</script>
